name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a secret committed and later removed is still in the
          # history, and that is the case this check exists for.
          fetch-depth: 0
      # The gitleaks BINARY, not gitleaks-action. The action is free only for
      # user-owned repositories and returns "missing gitleaks license" on any
      # organisation-owned one — which is every customer repository, so the
      # secret scan failed for every customer and passed for us. The binary
      # is MIT-licensed and scans identically. What is lost is the action's
      # PR annotations, which is why `pull-requests: read` is no longer here.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: '8.21.2'
        run: |
          # `set -e` is load-bearing: without it a failed download leaves this
          # job green, and a secret scan that silently stopped scanning is
          # worse than no secret scan at all.
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          # Exits non-zero when it finds something. --redact keeps the secret
          # itself out of the log, which is otherwise a second place it leaks.
          ./gitleaks detect --source . --redact --verbose
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # p/default plus a small custom ruleset closing a real coverage gap
      # (EMS-131): p/default's own child_process rule misses the 'node:'
      # URL-scheme prefix (require('node:child_process') /
      # import ... from 'node:child_process'), in both CommonJS and ESM.
      # See .semgrep/child-process-node-prefix.yaml for the rules and why
      # p/javascript, p/typescript and p/security-audit were evaluated and
      # rejected instead of this (docs/architecture.md D14, main repo).
      - run: semgrep scan --config p/default --config .semgrep/ --error
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Whether this app is built, and where its output goes, is read from
      # package.json: the same entry Emseapea reads at the same commit.
      - name: Read whether the app is built
        id: declared
        run: |
          node -e '
            const fs = require("fs");
            const say = (title, text) => { console.log("::error title=" + title + "::" + text); process.exit(1); };
            const inside = (v) => typeof v === "string" && v !== "" && !v.startsWith("/") && !v.includes("\\") &&
              !/[\r\n]/.test(v) && v.split("/").filter(Boolean).every((s) => s !== "." && s !== "..");
            if (!fs.existsSync("package.json")) { console.log("This app is one file and is not built."); process.exit(0); }
            let p;
            try { p = JSON.parse(fs.readFileSync("package.json", "utf8")); }
            catch (e) { say("package.json is not valid JSON", String(e.message)); }
            const b = p && p.emseapea && p.emseapea.build;
            if (!b) { console.log("This app is one file and is not built."); process.exit(0); }
            if (!inside(b.output) || !inside(b.main))
              say("The build is not described", "package.json needs emseapea.build.output, the folder the build writes, and emseapea.build.main, the file in it the app starts from.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "output=" + b.output + "\n" + "main=" + b.main + "\n");
          '
      - name: Build the app
        if: steps.declared.outputs.output != ''
        env:
          OUTPUT: ${{ steps.declared.outputs.output }}
          MAIN: ${{ steps.declared.outputs.main }}
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "::error title=No lockfile::A built app installs its dependencies only from a committed package-lock.json, so exactly what is installed is decided by the code the checks passed. Commit package-lock.json."
            exit 1
          fi
          # --ignore-scripts: no dependency runs code while it is being installed.
          if ! npm ci --ignore-scripts --no-audit --no-fund; then
            echo "::error title=The dependencies did not install::npm ci could not install exactly what package-lock.json lists. Its own output above says which package and why."
            exit 1
          fi
          if ! npm run build; then
            echo "::error title=The build command failed::npm run build did not finish. Its own output above says what went wrong."
            exit 1
          fi
          if [ ! -f "$OUTPUT/$MAIN" ]; then
            echo "::error title=The build wrote no starting file::The build finished without writing $OUTPUT/$MAIN, which package.json names as the file the app starts from."
            exit 1
          fi
      - name: Keep the build for Emseapea
        if: steps.declared.outputs.output != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emseapea-app
          path: ${{ steps.declared.outputs.output }}
          if-no-files-found: error
